# Продакшн-середовище: більше реплік і ресурсів, перевірена версія 1.0.0, вхід через Ingress.
# Пароль бази тут НЕ зберігається — передається під час встановлення:
#   helm upgrade --install ... -f values-prod.yaml --set database.password=<пароль>
config:
  appEnv: production
  logLevel: warning

database:
  password: ""          # обов'язковий параметр, порожнє значення зупинить встановлення

backend:
  replicaCount: 3
  image:
    tag: "1.0.0"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

frontend:
  replicaCount: 2
  image:
    tag: "1.0.0"
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

ingress:
  enabled: true

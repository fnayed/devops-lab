# Чутливі параметри. Значення беруться з values (database.password), у шаблоні їх немає.
{{- $password := include "devops-lab.dbPassword" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devops-lab.fullname" . }}-secret
  labels:
    {{- include "devops-lab.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ $password | b64enc | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:%v/%s" .Values.database.user ($password | urlquery) (include "devops-lab.componentName" (list . "postgres")) .Values.postgres.service.port .Values.database.name | b64enc | quote }}

# База даних PostgreSQL. Одна репліка: диск ReadWriteOnce підключається лише до одного пода.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devops-lab.componentName" (list . "postgres") }}
  labels:
    {{- include "devops-lab.componentLabels" (list . "postgres") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate # старий под має відпустити диск до старту нового
  selector:
    matchLabels:
      {{- include "devops-lab.selectorLabels" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devops-lab.componentLabels" (list . "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ include "devops-lab.image" (list . .Values.postgres.image) }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: {{ include "devops-lab.fullname" . }}-config, key: POSTGRES_DB }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: {{ include "devops-lab.fullname" . }}-config, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "devops-lab.fullname" . }}-secret, key: POSTGRES_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "devops-lab.componentName" (list . "postgres") }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}

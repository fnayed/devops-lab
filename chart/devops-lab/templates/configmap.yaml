# Нечутливі параметри застосунку — змінні оточення для контейнерів
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-lab.fullname" . }}-config
  labels:
    {{- include "devops-lab.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}

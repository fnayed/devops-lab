{{- if .Values.hooks.dbCheck.enabled }}
# Pre-upgrade хук: перед оновленням релізу перевіряє, що база даних приймає з'єднання.
# Якщо база недоступна ~60 с — Job завершується з помилкою і helm upgrade скасовується.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "devops-lab.fullname" . }}-db-check
  labels:
    {{- include "devops-lab.componentLabels" (list . "db-check") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 90
  template:
    metadata:
      labels:
        {{- include "devops-lab.componentLabels" (list . "db-check") | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: db-check
          image: {{ .Values.hooks.dbCheck.image }}
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 30); do
                if pg_isready -h {{ include "devops-lab.componentName" (list . "postgres") }} -p {{ .Values.postgres.service.port }} -U {{ .Values.database.user }}; then
                  echo "База даних доступна — оновлення дозволено"; exit 0
                fi
                sleep 2
              done
              echo "База даних недоступна — оновлення скасовано"; exit 1
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
{{- end }}

server {
    listen 80;

    # Статичні файли фронтенду
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Запити до API перенаправляються на контейнер з бекендом
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}

<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task List</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; padding: 40px 16px; }
    .card { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 24px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; font-size: 15px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
    li span { flex: 1; }
    li.done span { text-decoration: line-through; color: #999; }
    li button { background: #ef4444; padding: 6px 10px; font-size: 13px; }
    .status { font-size: 13px; color: #666; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Список задач</h1>
    <form id="form">
      <input type="text" id="title" placeholder="Нова задача..." required maxlength="200">
      <button type="submit">Додати</button>
    </form>
    <ul id="list"></ul>
    <div class="status" id="status"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>

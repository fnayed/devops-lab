# Доступ до бази лише всередині кластера, за іменем "postgres"
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: devops-lab
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: devops-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432

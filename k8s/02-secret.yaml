# Чутливі параметри. Значення навчальні — не паролі від реальних систем.
# stringData дозволяє писати значення відкритим текстом, Kubernetes сам закодує їх у base64.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: devops-lab
  labels:
    app.kubernetes.io/part-of: devops-lab
type: Opaque
stringData:
  POSTGRES_PASSWORD: "lab3-demo-password"
  DATABASE_URL: "postgresql+psycopg://app:lab3-demo-password@postgres:5432/tasks"

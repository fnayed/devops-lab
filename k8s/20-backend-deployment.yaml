# Бекенд (FastAPI). Образ з GHCR з конкретним тегом версії (не latest).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops-lab
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: devops-lab
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # під час оновлення завжди є робочі поди
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: devops-lab
    spec:
      containers:
        - name: backend
          image: ghcr.io/fnayed/devops-lab-backend:1.0.0
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef: { name: app-config, key: APP_ENV }
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: { name: app-config, key: LOG_LEVEL }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: app-secret, key: DATABASE_URL }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe: # под отримує трафік лише коли готовий
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe: # якщо под завис — Kubernetes його перезапустить
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10

# Source: devops-lab/templates/backend-deployment.yaml
# Бекенд (FastAPI). Тег образу — з values (backend.image.tag) або appVersion чарта.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-devops-lab-backend
  labels:
    helm.sh/chart: devops-lab-0.1.0
    app.kubernetes.io/name: devops-lab
    app.kubernetes.io/instance: app
    app.kubernetes.io/version: "1.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: devops-lab
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # під час оновлення завжди є робочі поди
      maxSurge: 1
  selector:
    matchLabels:
      
      app.kubernetes.io/name: devops-lab
      app.kubernetes.io/instance: app
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        helm.sh/chart: devops-lab-0.1.0
        app.kubernetes.io/name: devops-lab
        app.kubernetes.io/instance: app
        app.kubernetes.io/version: "1.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: devops-lab
        app.kubernetes.io/component: backend
      annotations:
        # поди перезапускаються, якщо змінилися конфігурація або секрет
        checksum/config: ed61b92b227f4b7836a9cecc8381b1faeb65b4c6c4d1efc16491356f26adb1f0
        checksum/secret: 712336a319ddd19380a7563b52a9371ade6ca42e6f2a19b14521e0a5c501fd68
    spec:
      containers:
        - name: backend
          image: ghcr.io/fnayed/devops-lab-backend:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef: { name: app-devops-lab-config, key: APP_ENV }
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: { name: app-devops-lab-config, key: LOG_LEVEL }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: app-devops-lab-secret, key: DATABASE_URL }
          resources:
            limits:
              cpu: 300m
              memory: 192Mi
            requests:
              cpu: 50m
              memory: 96Mi
          readinessProbe: # под отримує трафік лише коли готовий
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe: # якщо под завис — Kubernetes його перезапустить
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          lifecycle:
            preStop: # час прибрати под із балансування — оновлення без втрати запитів
              exec:
                command: ["sleep", "5"]

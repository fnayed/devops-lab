# Source: devops-lab/templates/postgres-deployment.yaml
# База даних PostgreSQL. Одна репліка: диск ReadWriteOnce підключається лише до одного пода.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-devops-lab-postgres
  labels:
    helm.sh/chart: devops-lab-0.1.0
    app.kubernetes.io/name: devops-lab
    app.kubernetes.io/instance: app
    app.kubernetes.io/version: "1.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: devops-lab
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate # старий под має відпустити диск до старту нового
  selector:
    matchLabels:
      
      app.kubernetes.io/name: devops-lab
      app.kubernetes.io/instance: app
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        helm.sh/chart: devops-lab-0.1.0
        app.kubernetes.io/name: devops-lab
        app.kubernetes.io/instance: app
        app.kubernetes.io/version: "1.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: devops-lab
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: app-devops-lab-config, key: POSTGRES_DB }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: app-devops-lab-config, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-devops-lab-secret, key: POSTGRES_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: app-devops-lab-postgres-data
---
# Source: devops-lab/templates/tests/test-health.yaml
# Тест релізу (helm test): запит через фронтенд до /api/health перевіряє весь ланцюжок
# frontend (nginx) -> backend -> PostgreSQL.
apiVersion: v1
kind: Pod
metadata:
  name: app-devops-lab-test-health
  labels:
    helm.sh/chart: devops-lab-0.1.0
    app.kubernetes.io/name: devops-lab
    app.kubernetes.io/instance: app
    app.kubernetes.io/version: "1.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: devops-lab
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          set -e
          URL=http://app-devops-lab-frontend:80
          echo "GET $URL/api/health"; wget -qO- $URL/api/health; echo
          echo "GET $URL/api/info";   wget -qO- $URL/api/info;   echo
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 32Mi }
---
# Source: devops-lab/templates/hook-db-check.yaml
# Pre-upgrade хук: перед оновленням релізу перевіряє, що база даних приймає з'єднання.
# Якщо база недоступна ~60 с — Job завершується з помилкою і helm upgrade скасовується.
apiVersion: batch/v1
kind: Job
metadata:
  name: app-devops-lab-db-check
  labels:
    helm.sh/chart: devops-lab-0.1.0
    app.kubernetes.io/name: devops-lab
    app.kubernetes.io/instance: app
    app.kubernetes.io/version: "1.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: devops-lab
    app.kubernetes.io/component: db-check
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 90
  template:
    metadata:
      labels:
        helm.sh/chart: devops-lab-0.1.0
        app.kubernetes.io/name: devops-lab
        app.kubernetes.io/instance: app
        app.kubernetes.io/version: "1.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: devops-lab
        app.kubernetes.io/component: db-check
    spec:
      restartPolicy: Never
      containers:
        - name: db-check
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 30); do
                if pg_isready -h app-devops-lab-postgres -p 5432 -U app; then
                  echo "База даних доступна — оновлення дозволено"; exit 0
                fi
                sleep 2
              done
              echo "База даних недоступна — оновлення скасовано"; exit 1
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }

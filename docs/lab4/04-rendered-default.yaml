# Source: devops-lab/templates/frontend-configmap.yaml
# Конфігурація nginx фронтенду. В образі адреса бекенду жорстко задана як "backend:8000",
# а в чарті імена сервісів будуються з імені релізу — тому конфіг підставляється з шаблону.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-devops-lab-frontend-nginx
  labels:
    helm.sh/chart: devops-lab-0.1.0
    app.kubernetes.io/name: devops-lab
    app.kubernetes.io/instance: app
    app.kubernetes.io/version: "1.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: devops-lab
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/ {
            proxy_pass http://app-devops-lab-backend:8000;
            proxy_set_header Host $host;
        }
    }

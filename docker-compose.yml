services:
  # База даних PostgreSQL
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tasks
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tasks"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Бекенд (Python + FastAPI)
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/tasks
      APP_ENV: docker-compose
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Фронтенд (nginx)
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db-data:
